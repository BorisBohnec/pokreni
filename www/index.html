<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1F5FBF">
<title>PoKreni</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand" aria-label="PoKreni">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="mark" width="32" height="32" rx="9"/><path class="chev" d="M9.5 9.5L16 16l-6.5 6.5"/><path class="chev two" d="M16 9.5l6.5 6.5L16 22.5"/></svg>
      <span class="brand-name">Po<b>Kreni</b></span>
    </div>
    <button class="lang-btn" id="langBtn" data-act="lang">HR</button>
  </header>

  <main>
    <section class="view" id="view-today" aria-live="polite"></section>
    <section class="view" id="view-learn" hidden></section>
    <section class="view" id="view-train" hidden></section>
    <section class="view" id="view-progress" hidden></section>
    <section class="view" id="view-profile" hidden></section>
    <section class="view" id="view-coach" hidden></section>
  </main>
</div>

<div class="rest-bar" id="restBar" hidden role="timer" aria-live="off"></div>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-in">
    <button class="tab" id="tab-today" data-act="tab" data-tab="today"></button>
    <button class="tab" id="tab-learn" data-act="tab" data-tab="learn"></button>
    <button class="tab-go" id="tabGo" data-act="go"></button>
    <button class="tab" id="tab-progress" data-act="tab" data-tab="progress"></button>
    <button class="tab" id="tab-profile" data-act="tab" data-tab="profile"></button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="scrim" data-act="sheet-close"></div>
  <div class="panel" id="sheetPanel" tabindex="-1">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="icon-btn" id="sheetBack" data-act="sheet-back" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
      <div class="sheet-titles"><h2 id="sheetTitle"></h2><div class="sheet-sub" id="sheetSub"></div></div>
      <button class="icon-btn" data-act="sheet-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="i18n.js"></script>
<script src="data/exercises.js"></script>
<script src="data/programs.js"></script>
<script src="data/lessons.js"></script>
<script src="data/body.js"></script>
<script src="logic.js"></script>
<script src="ai.js"></script>
<script src="coach.js"></script>
<script src="app.js"></script>
</body>
</html>
